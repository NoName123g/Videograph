<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://necolas.github.io/normalize.css/latest/normalize.css">
    <link rel="stylesheet" href="style.css">
    <title>Видеограф Ваха</title>
</head>
<body>

        <div class="header_container">

            </div>
            <div class="header_left">
                <nav class="nav">
                    <ul class="nav_list">
                        <li class="nav_list_elem">Репродукции</li>
                        <li class="nav_list_elem">Новинки</li>
                        <li class="nav_list_elem">О нас</li>
                        <li class="nav_list_elem"><img src="image/header_shop_logo.png" alt="лого корзины" class="header_shop_icon"></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
</body>
</html>
