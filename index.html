<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://necolas.github.io/normalize.css/latest/normalize.css">
    <link rel="stylesheet" href="style.css">
    <title>Видеограф Ваха</title>
</head>
<body>
    <header class="header">
        <div class="header_container container">
            <div class="header_right">
                <img src="image/header_logo.png" alt="лого" class="header_logo">
                <p class="header_logo_name">Ink. House</p>
            </div>
            <div class="header_left">
                <nav class="nav">
                    <ul class="nav_list">
                        <li class="nav_list_elem"><a href="#" class="nav_list_elem_link">Репродукции</a></li>
                        <li class="nav_list_elem"><a href="#" class="nav_list_elem_link">Новинки</a></li>
                        <li class="nav_list_elem"><a href="#" class="nav_list_elem_link">О нас</a></li>
                        <li class="nav_list_elem"><img src="image/header_shop_logo.png" alt="лого корзины" class="header_shop_icon"></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    <div class="hero">
        <div class="hero_container container">
            <div class="hero_right">
                <img src="image/hero_image.png" alt="Картинка Птица" class="hero_img">
            </div>
            <div class="hero_left">
                <div class="herp_left_container">
                    <div class="hero_left_top">
                        <h1 class="hero_title">Реплики картин<br> от <span class="hero_title_text">Ink. House</span></h1>
                        <p class="hero_text">Высокое качество отрисовки на плотной бумаге или льняном <br> холсте. Редкие произведения, доступные цены.</p>
                    </div>
                    <div class="hero_left_bottom">
                        <button class="hero_button">
                            <span class="hero_button_text">Продукция</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
