<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Птички</title>
</head>
<body>
    <div class="wrapper">
        <header class="header">
            <div class="header-left">
                <img src="image/header_logo.svg" alt="Лого" class="header-logo">
                <h2 class="header-logo-text">Ink. House</h2>
            </div>
            <div class="header-right">
                <ul class="header-list">
                    <li class="header-list-elem"><a href="#" class="header-list-link">Репродукции</a></li>
                    <li class="header-list-elem"><a href="#" class="header-list-link">Новинки</a></li>
                    <li class="header-list-elem"><a href="#" class="header-list-link">О нас</a></li>
                    <li class="header-list-elem">
                        <a href="#" class="header-list-link">
                            <img src="image/header_market.svg" alt="Лого" class="header-market-logo">
                        </a>
                    </li>
                </ul>
            </div>
        </header>
        <main class="main">
            <section class="hero">
                <div class="hero-left">
                    <img src="image/bird.png" alt="Картинка" class="bird-png">
                </div>
                <div class="hero-right">
                    <div class="hero-right-top">
                        <h1 class="hero-title">Реплики картин от <span class="bold-text">Ink. House</span></h1>
                        <p class="hero-text">Высокое качество отрисовки на плотной бумаге или льняном холсте. Редкие произведения, доступные цены.</p>
                    </div>
                    <div class="hero-right-bottom">
                        <button class="hero-button">
                            <span class="hero-button-text">Продукция</span>
                        </button>
                    </div>
                </div>
            </section>
            <div></div>
            <div></div>
            <div></div>
        </main>
        <footer></footer>
    </div>
</body>
</html>
